<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undo Trail – prototype</title>
<!--
  Undo Trail: a clickable walkthrough prototype.
  Everything is in this one file (HTML for structure, CSS for looks, JavaScript for behaviour).
  The "agent" is SIMULATED: its actions are a fixed script in the ACTIONS list below.
  No AI model, no network, no API key.
-->
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1f2328; --muted: #5f6670; --line: #dcd9d2;
    --accent: #2f5d8a; --ok: #2e7d4f; --okbg: #e5f4e4; --warn: #9a5b00; --warnbg: #f9eeda;
    --bad: #a3322e; --badbg: #fbebeb; --planned: #6a4fb3; --plannedbg: #efedff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--ink); color: #fff; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 2px 0 0; color: #c9ccd1; font-size: 14px; }
  .sim { background: var(--warnbg); color: var(--warn); padding: 8px 20px; font-size: 14px; border-bottom: 1px solid var(--line); }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
  /* scene stepper */
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .steps button { border: 1px solid var(--line); background: var(--card); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .steps button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .panel h2 { margin-top: 0; font-size: 19px; }
  .who { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .bubble { background: #eef3f8; border-radius: 10px; padding: 12px 14px; margin: 8px 0; }
  .bubble.agent { background: #f1f0ec; }
  .nav { display: flex; justify-content: space-between; margin-top: 10px; }
  button.primary { background: var(--accent); color: #fff; border: 0; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button.plain { background: none; border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  /* condition switch */
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .switch button { border: 0; background: var(--card); padding: 7px 12px; cursor: pointer; font-size: 14px; }
  .switch button.on { background: var(--ink); color: #fff; }
  /* standard log */
  .log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; background: #fafaf8; border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  .log div.undone { text-decoration: line-through; color: var(--muted); }
  /* labelled trace */
  .step { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 10px 0; display: grid; grid-template-columns: 28px 1fr; gap: 8px; }
  .step.undone { background: #f4f4f2; color: var(--muted); }
  .step .title { font-weight: 600; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-right: 6px; }
  .chip.undo { background: var(--okbg); color: var(--ok); }
  .chip.window { background: var(--warnbg); color: var(--warn); }
  .chip.none { background: var(--badbg); color: var(--bad); }
  .chip.planned { background: var(--plannedbg); color: var(--planned); }
  .conseq { font-size: 14px; margin-top: 4px; }
  .dep { font-size: 13px; color: var(--bad); margin-top: 4px; }
  details { font-size: 14px; margin-top: 6px; }
  .preview { border-left: 4px solid var(--accent); background: #f3f6fa; padding: 10px 14px; border-radius: 4px; margin-top: 12px; }
  .preview ul { margin: 6px 0; padding-left: 20px; }
  textarea { width: 100%; min-height: 110px; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .toast { background: var(--okbg); color: var(--ok); padding: 8px 12px; border-radius: 6px; margin-top: 10px; font-size: 14px; }
  .toast.grey { background: #f1f0ec; color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); }
  @media (max-width: 560px) { .nav { flex-direction: column; gap: 8px; } }
</style>
</head>
<body>
<header>
  <h1>Undo Trail</h1>
  <p>Prototype: helping a person decide what to undo after an AI agent has acted</p>
</header>
<div class="sim">Simulated agent: actions are scripted, not generated by an AI model. Files, emails and people are fictional.</div>

<main>
  <div class="steps" id="steps"></div>
  <div id="scene"></div>
</main>

<script>
/* ---------------------------------------------------------------
   1. THE SCRIPT: what the simulated agent did, in order.
   reversibility: "undo"   = can be undone now
                  "window" = can be undone for a limited time
                  "none"   = cannot be undone (needs a compensating action)
   dependsOn: the step whose result this action relied on.
   ------------------------------------------------------------- */
const ACTIONS = [
  { id: 1, log: "mkdir Q3/Archive",
    title: "Created folder “Q3/Archive”", reversibility: "undo",
    consequence: "New empty folder. Removing it changes nothing else.",
    why: "You asked for old material to be kept, not deleted." },
  { id: 2, log: "mv 12 files -> Q3/Archive",
    title: "Moved 12 older drafts into Archive", reversibility: "undo", dependsOn: 1,
    consequence: "Files are unchanged, only their location. Links to them still work.",
    why: "These files had not been opened for over 60 days." },
  { id: 3, log: "rename 4 files",
    title: "Renamed 4 files to the “Q3_topic_final” pattern", reversibility: "undo",
    consequence: "Only names changed. Two shared links point to the old names.",
    why: "Your team's naming guide uses this pattern." },
  { id: 4, log: "rm Q3_budget_v3.xlsx",
    title: "Deleted “Q3_budget_v3.xlsx” as a duplicate", reversibility: "window",
    consequence: "In Trash. Restorable until 25 Dec. After that it is gone.",
    why: "It was 94% identical to “Q3_budget_v2_final.xlsx”, so the agent kept the file named “final”. (This was the mistake: v3 was the newest version.)",
    mistake: true },
  { id: 5, log: "send_email team-q3 'Folder tidied'",
    title: "Emailed the Q3 team (8 people)", reversibility: "none", dependsOn: 4,
    consequence: "Told everyone the latest budget is v2_final. Sent emails cannot be recalled.",
    why: "You asked the agent to let the team know when it finished.",
    emailBody: "Hi all, the Q3 folder is tidied. The latest budget is Q3_budget_v2_final.xlsx." },
  { id: 6, log: "calendar.update 'Q3 review' attach v2_final",
    title: "Attached the v2 budget to Thursday's “Q3 review” meeting", reversibility: "undo", dependsOn: 4,
    consequence: "All 8 invitees now see v2 attached to the meeting.",
    why: "The meeting invite linked to the budget file that was deleted." }
];

/* ---------------------------------------------------------------
   2. STATE: what has changed during this walkthrough.
   ------------------------------------------------------------- */
const state = {
  scene: 0,
  condition: "trace",          // "log" = standard log, "trace" = labelled trace
  undone: new Set(),           // ids of actions the person has undone
  selected: new Set(),         // ids ticked in the labelled trace
  correctionSent: false,
  logMessage: ""
};

const SCENES = ["1 Request", "2 Agent report", "3 Problem noticed", "4 Recover", "5 Outcome"];
const byId = id => ACTIONS.find(a => a.id === id);
const chip = r => ({
  undo:   '<span class="chip undo">Can be undone</span>',
  window: '<span class="chip window">Undoable for 30 days</span>',
  none:   '<span class="chip none">Cannot be undone</span>'
})[r];

/* ---------------------------------------------------------------
   3. SCENES: each function returns the HTML for one screen.
   ------------------------------------------------------------- */
function sceneRequest() {
  return `<div class="panel">
    <div class="who">You → agent</div>
    <div class="bubble">“Tidy up the Q3 project folder. Archive old drafts, remove duplicates, and let the team know when you're done.”</div>
    <p class="note">The person delegates a multi-step task and steps away. The agent runs without asking in between.</p>
  </div>`;
}

function sceneReport() {
  return `<div class="panel">
    <div class="who">Agent → you, 9 minutes later</div>
    <div class="bubble agent">“Done. I archived 12 drafts, tidied file names, removed 1 duplicate and emailed the team.”</div>
    <p class="note">A typical completion message: short, confident, and it hides the details.</p>
  </div>`;
}

function sceneProblem() {
  return `<div class="panel">
    <div class="who">Message from Priya (finance), 10:42</div>
    <div class="bubble">“Why does the email say the latest budget is v2? I uploaded v3 yesterday with the revised costs — I can't find it anywhere.”</div>
    <p class="note">The error is discovered afterwards, by someone else. The person now has to work out what happened and what to undo.</p>
  </div>`;
}

function sceneRecover() {
  const sw = `<div class="switch" role="group" aria-label="Recovery view">
      <button class="${state.condition === 'log' ? 'on' : ''}" onclick="setCondition('log')">Standard log</button>
      <button class="${state.condition === 'trace' ? 'on' : ''}" onclick="setCondition('trace')">Labelled trace</button>
    </div>`;
  return `<div class="panel"><h2>What did the agent do?</h2>${sw}
    ${state.condition === 'log' ? viewLog() : viewTrace()}</div>`;
}

/* Comparison condition: a plain log like many tools show today. */
function viewLog() {
  const lines = ACTIONS.map(a =>
    `<div class="${state.undone.has(a.id) ? 'undone' : ''}">10:3${a.id} ${a.log}</div>`).join("");
  return `<p class="note">Comparison condition: commands in order, with generic undo.</p>
    <div class="log">${lines}</div>
    <div class="nav" style="justify-content:flex-start;gap:8px">
      <button class="plain" onclick="logUndoLast()">Undo last action</button>
      <button class="plain" onclick="logUndoAll()">Undo all</button>
    </div>
    ${state.logMessage ? `<div class="toast grey">${state.logMessage}</div>` : ""}`;
}

/* Main design: each action shows its consequence, reversibility and dependencies. */
function viewTrace() {
  const cards = ACTIONS.map(a => {
    const undone = state.undone.has(a.id);
    const dep = a.dependsOn && byId(a.dependsOn).mistake
      ? `<div class="dep">Relies on step ${a.dependsOn}. If step ${a.dependsOn} was wrong, this may be wrong too.</div>` : "";
    const control = a.reversibility === "none"
      ? `<input type="checkbox" disabled title="Cannot be undone" aria-label="Cannot be undone">`
      : `<input type="checkbox" ${state.selected.has(a.id) ? "checked" : ""} ${undone ? "disabled" : ""}
           onchange="toggleSelect(${a.id})" aria-label="Select step ${a.id} to undo">`;
    return `<div class="step ${undone ? 'undone' : ''}">
      <div>${control}</div>
      <div>
        <div class="title">${a.id}. ${a.title} ${undone ? "(undone)" : ""}</div>
        <div>${chip(a.reversibility)}</div>
        <div class="conseq">${a.consequence}</div>
        ${dep}
        <details><summary>Why did the agent do this?</summary>${a.why}</details>
        ${a.reversibility === "none" ? correctionBox(a) : ""}
      </div>
    </div>`;
  }).join("");
  return `<p class="note">Tick the steps you want to undo, then preview before anything changes.</p>
    ${cards}
    <div class="nav" style="justify-content:flex-start">
      <button class="primary" onclick="render(true)" ${state.selected.size ? "" : "disabled"}>Preview undo</button>
    </div>
    ${window._preview ? previewBox() : ""}`;
}

/* For an action that cannot be undone, the agent proposes a correction and the person decides. */
function correctionBox(a) {
  if (state.correctionSent) return `<div class="toast">Correction sent to the Q3 team. The original email still exists in their inboxes.</div>`;
  const v3back = state.undone.has(4);
  const text = v3back
    ? "Hi all, correction to my earlier email: the latest budget is Q3_budget_v3.xlsx (restored). Please ignore v2_final for Thursday's review."
    : "Hi all, correction to my earlier email: the latest budget is Q3_budget_v3.xlsx, not v2_final.";
  return `<div class="preview">
    <strong>Suggested correction (draft, not sent):</strong>
    ${v3back ? "" : `<div class="dep">v3 is still in Trash. Restore step 4 first or the team will be pointed to a file they can't open.</div>`}
    <textarea id="corr">${text}</textarea>
    <div class="nav" style="justify-content:flex-start;gap:8px">
      <button class="primary" onclick="sendCorrection()">Send correction</button>
      <span class="note">You can edit the text. Nothing is sent until you press Send.</span>
    </div>
  </div>`;
}

/* Preview: what will change, and what will NOT be fixed by this undo. */
function previewBox() {
  const ids = [...state.selected].sort();
  const will = ids.map(id => `<li>Undo step ${id}: ${byId(id).title}</li>`).join("");
  const remains = [];
  if (ids.includes(4) && !state.correctionSent)
    remains.push("Step 5's email still tells 8 people that v2 is the latest. Undoing step 4 does not change that email.");
  if (ids.includes(4) && !ids.includes(6) && !state.undone.has(6))
    remains.push("Step 6 still attaches v2 to Thursday's meeting.");
  if (ids.includes(1) && !ids.includes(2) && !state.undone.has(2))
    remains.push("Step 1's folder is not empty while step 2's files are inside it, so it cannot be removed alone.");
  return `<div class="preview">
    <strong>If you continue:</strong><ul>${will}</ul>
    ${remains.length ? `<strong>This will not fix:</strong><ul>${remains.map(r => `<li>${r}</li>`).join("")}</ul>` : ""}
    <div class="nav" style="justify-content:flex-start;gap:8px">
      <button class="primary" onclick="confirmUndo()">Confirm undo</button>
      <button class="plain" onclick="window._preview=false;render()">Cancel</button>
    </div>
  </div>`;
}

function sceneOutcome() {
  const restored = ACTIONS.filter(a => state.undone.has(a.id)).map(a => `<li>${a.title}</li>`).join("") || "<li>Nothing yet</li>";
  const left = ACTIONS.filter(a => !state.undone.has(a.id)).map(a => {
    if (a.id === 5) return `<li>${a.title}: ${state.correctionSent ? "correction sent" : "<strong>still uncorrected</strong>"}</li>`;
    return `<li>${a.title}</li>`;
  }).join("");
  const fixed = state.undone.has(4) && state.undone.has(6) && state.correctionSent;
  return `<div class="panel"><h2>Where things stand</h2>
    <strong>Undone:</strong><ul>${restored}</ul>
    <strong>Still in effect:</strong><ul>${left}</ul>
    <div class="toast ${fixed ? '' : 'grey'}">${fixed
      ? ([1, 2, 3].some(id => state.undone.has(id))
          ? "The mistake has been dealt with, but some correct work was undone too and will need redoing."
          : "The mistake and everything that relied on it has been dealt with. The rest of the tidy-up was kept.")
      : "Some consequences of the mistake remain. Go back to step 4 to continue."}</div>
    <p style="margin-top:14px"><span class="chip planned">Planned</span>
      Telling the agent “v3 is the newest; ask before deleting budget files” so it does not repeat the mistake. Not built in this prototype.</p>
  </div>`;
}

/* ---------------------------------------------------------------
   4. ACTIONS THE PERSON CAN TAKE
   ------------------------------------------------------------- */
function setCondition(c) { state.condition = c; window._preview = false; render(); }
function toggleSelect(id) { state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); window._preview = false; render(); }

function confirmUndo() {
  // Undoing the folder (1) also needs its contents (2) moved back first.
  state.selected.forEach(id => {
    if (id === 1 && !state.selected.has(2) && !state.undone.has(2)) return;
    state.undone.add(id);
  });
  state.selected.clear(); window._preview = false; render();
}

function sendCorrection() { state.correctionSent = true; render(); }

// Standard log behaviour: undo goes backwards in time; the email is skipped quietly.
function logUndoLast() {
  const next = [...ACTIONS].reverse().find(a => !state.undone.has(a.id) && a.reversibility !== "none");
  if (next) { state.undone.add(next.id); state.logMessage = "Undone: " + next.log; }
  render();
}
function logUndoAll() {
  ACTIONS.forEach(a => { if (a.reversibility !== "none") state.undone.add(a.id); });
  state.logMessage = "Undo complete. 1 action could not be undone.";
  render();
}

/* ---------------------------------------------------------------
   5. DRAWING THE PAGE
   ------------------------------------------------------------- */
const sceneFns = [sceneRequest, sceneReport, sceneProblem, sceneRecover, sceneOutcome];

function go(i) { state.scene = i; window._preview = false; render(); window.scrollTo(0, 0); }

function render(showPreview) {
  if (showPreview === true) window._preview = true;
  document.getElementById("steps").innerHTML = SCENES.map((s, i) =>
    `<button class="${i === state.scene ? 'on' : ''}" onclick="go(${i})">${s}</button>`).join("");
  const nav = `<div class="nav">
      <button class="plain" onclick="go(${state.scene - 1})" ${state.scene === 0 ? "disabled" : ""}>Back</button>
      ${state.scene < SCENES.length - 1
        ? `<button class="primary" onclick="go(${state.scene + 1})">Next</button>`
        : `<button class="plain" onclick="location.reload()">Start again</button>`}
    </div>`;
  document.getElementById("scene").innerHTML = sceneFns[state.scene]() + nav;
}

render();
</script>
</body>
</html>
